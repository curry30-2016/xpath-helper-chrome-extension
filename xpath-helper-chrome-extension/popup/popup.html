<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XPath Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>XPath Helper</h1>
      <div class="toggle-container">
        <label class="toggle">
          <input type="checkbox" id="toggleActive">
          <span class="slider"></span>
        </label>
        <span class="toggle-label">启用选择</span>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <label for="xpathInput">XPath 表达式</label>
        <div class="format-toggle">
          <button id="btnRelative" class="format-btn active" title="相对路径">相对</button>
          <button id="btnAbsolute" class="format-btn" title="绝对路径">绝对</button>
        </div>
      </div>
      <div class="input-group">
        <input type="text" id="xpathInput" placeholder="Shift+点击元素 或 输入 XPath...">
        <button id="btnCopyXPath" class="icon-btn" title="复制 XPath">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M10 1H3C1.9 1 1 1.9 1 3V10H3V3H10V1ZM12 4H5C3.9 4 3 4.9 3 6V13C3 14.1 3.9 15 5 15H12C13.1 15 14 14.1 14 13V6C14 4.9 13.1 4 12 4Z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <span>匹配结果</span>
        <span id="matchCount" class="badge">0</span>
      </div>
      <div id="results" class="results">
        <div class="empty-state">Shift+点击页面元素获取 XPath</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <span>提取文本</span>
        <button id="btnCopyText" class="text-btn" title="复制所有文本">复制</button>
      </div>
      <textarea id="extractedText" class="text-area" readonly placeholder="匹配元素的文本内容将显示在这里..."></textarea>
    </div>

    <div class="footer">
      <span class="hint">提示: 按住 Shift 点击元素 | Esc 退出选择</span>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
